set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

bind q confirm-before -p "Kill tmux session? (y/n)" kill-session

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with repeated Vim keys.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

unbind '"'
unbind %

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind e select-layout even-vertical
bind E select-layout even-horizontal

# New window in the current working directory.
bind t new-window -c "#{pane_current_path}"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind -r ] next-window
bind -r [ previous-window

# Switch directly to windows using Alt+number.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set -g mouse on
set -g history-limit 100000

# Reduce delay when using Escape in Vim/Neovim.
set -sg escape-time 0

run '~/.tmux/plugins/tpm/tpm'

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 80

set -g status-left " #S "
set -g status-right " %Y-%m-%d %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[bold]#I:#W#[default] "
