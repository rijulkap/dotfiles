set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Prefix keys are sequential: press C-Space, release it, then press the command key.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Pane navigation and lifecycle.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

unbind '"'
unbind %

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind q confirm-before -p "Kill pane? (y/n)" kill-pane
bind z resize-pane -Z

bind e select-layout even-vertical
bind E select-layout even-horizontal

# Windows.
bind t new-window -c "#{pane_current_path}"
bind -r ] next-window
bind -r [ previous-window
bind x confirm-before -p "Kill window? (y/n)" kill-window
bind Q confirm-before -p "Kill session? (y/n)" kill-session

# Configuration.
bind R source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# General behavior.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Vim-style copy mode. Mouse selections continue to use tmux's defaults.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

run '~/.tmux/plugins/tpm/tpm'

# Status line.
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 80

set -g status-left " #S "
set -g status-right " %Y-%m-%d %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[bold]#I:#W#[default] "
