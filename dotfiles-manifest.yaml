version: 1

# Package managers required by install commands.
package_managers:
  apt:
    description: Debian/Ubuntu package manager
    platform: linux
    check: apt-get
    hint: "apt-get not found. Install a Debian-based distro or adjust the manifest."

  choco:
    description: Chocolatey package manager for Windows
    platform: windows
    check: choco
    hint: "Chocolatey not found. Install from https://chocolatey.org/install or run as admin: Set-ExecutionPolicy Bypass -Scope Process -Force; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))"

# Tool definitions, configuration links, and reusable machine profiles.
tools:
  git:
    description: Distributed version control
    tags: [core, dev, workstation]
    check: git
    configs: [git]
    install:
      linux:
        - sudo apt-get update
        - sudo apt-get install -y git
      windows:
        - choco install git -y

  rust:
    description: Rust toolchain and Cargo
    tags: [dev, workstation]
    check: cargo
    install:
      linux:
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      windows:
        - Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" -OutFile "$env:TEMP/rustup-init.exe"
        - Start-Process -FilePath "$env:TEMP/rustup-init.exe" -ArgumentList "-y" -Wait
        - Remove-Item "$env:TEMP/rustup-init.exe" -Force

  cpp:
    description: C and C++ build tools
    tags: [dev, workstation]
    check: clang
    install:
      linux:
        - sudo apt-get update
        - sudo apt-get install -y build-essential make cmake clang llvm
      windows:
        - choco install mingw make cmake llvm -y

  fish:
    description: Fish shell
    tags: [shell, workstation]
    check: fish
    configs: [fish]
    install:
      linux:
        - sudo apt-get update
        - sudo apt-get install -y fish

  neovim:
    description: Neovim editor
    tags: [editor, dev, workstation]
    check: nvim
    configs: [nvim]
    install:
      linux:
        - curl -fLo /tmp/nvim.appimage https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.appimage
        - chmod +x /tmp/nvim.appimage
        - sudo install /tmp/nvim.appimage /usr/local/bin/nvim
        - rm -f /tmp/nvim.appimage
      windows:
        - choco install neovim -y

  tree-sitter-cli:
    description: Tree-sitter command line interface
    tags: [editor, dev, workstation]
    depends_on: [rust]
    check: tree-sitter
    install:
      linux:
        - source "$HOME/.cargo/env" 2>/dev/null || true; cargo install --locked tree-sitter-cli
      windows:
        - cargo install --locked tree-sitter-cli

  lazygit:
    description: Terminal UI for Git
    tags: [terminal, workstation]
    depends_on: [git]
    check: lazygit
    install:
      linux:
        - >-
          LAZYGIT_VERSION=$(curl -fsSL https://api.github.com/repos/jesseduffield/lazygit/releases/latest | sed -n 's/.*"tag_name": "v\([^"]*\)".*/\1/p' | head -n1)
        - test -n "$LAZYGIT_VERSION"
        - curl -fLo /tmp/lazygit.tar.gz "https://github.com/jesseduffield/lazygit/releases/download/v${LAZYGIT_VERSION}/lazygit_${LAZYGIT_VERSION}_Linux_x86_64.tar.gz"
        - tar -C /tmp -xf /tmp/lazygit.tar.gz lazygit
        - sudo install /tmp/lazygit /usr/local/bin/lazygit
        - rm -f /tmp/lazygit /tmp/lazygit.tar.gz
      windows:
        - choco install lazygit -y

  ripgrep:
    description: Fast text search
    tags: [core, dev, workstation]
    check: rg
    install:
      linux:
        - sudo apt-get update
        - sudo apt-get install -y ripgrep
      windows:
        - choco install ripgrep -y

  fd:
    description: Fast file finder
    tags: [core, dev, workstation]
    check:
      linux: fdfind
      windows: fd
    install:
      linux:
        - sudo apt-get update
        - sudo apt-get install -y fd-find
      windows:
        - choco install fd -y

  fzf:
    description: Fuzzy finder
    tags: [core, dev, workstation]
    check: fzf
    install:
      linux:
        - sudo apt-get update
        - sudo apt-get install -y fzf
      windows:
        - choco install fzf -y

  starship:
    description: Cross-shell prompt
    tags: [shell, workstation]
    check: starship
    configs: [starship]
    install:
      linux:
        - curl -sS https://starship.rs/install.sh | sh -s -- -y
      windows:
        - choco install starship -y

  wezterm:
    description: Terminal emulator
    tags: [terminal, workstation]
    check: wezterm
    configs: [wezterm]
    install:
      linux:
        - curl -fsSL https://apt.fury.io/wez/gpg.key | sudo gpg --yes --dearmor -o /etc/apt/keyrings/wezterm-fury.gpg
        - echo 'deb [signed-by=/etc/apt/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *' | sudo tee /etc/apt/sources.list.d/wezterm.list >/dev/null
        - sudo apt-get update
        - sudo apt-get install -y wezterm-nightly
      windows:
        - choco install wezterm -y

  zoxide:
    description: Smarter directory navigation
    tags: [shell, workstation]
    depends_on: [rust]
    check: zoxide
    install:
      linux:
        - source "$HOME/.cargo/env" 2>/dev/null || true; cargo install --locked zoxide
      windows:
        - cargo install --locked zoxide

  yazi:
    description: Terminal file manager
    tags: [terminal, workstation]
    depends_on:
      linux: [rust]
      windows: []
    check: yazi
    configs: [yazi-config, yazi-theme, yazi-keymap]
    install:
      linux:
        - source "$HOME/.cargo/env" 2>/dev/null || true; cargo install --locked yazi-fm yazi-cli
      windows:
        - choco install yazi -y

  vscode:
    description: Visual Studio Code
    tags: [dev, workstation]
    check: code
    install:
      linux:
        - sudo apt-get update
        - sudo apt-get install -y wget gpg apt-transport-https
        - wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /tmp/packages.microsoft.gpg
        - sudo install -D -o root -g root -m 644 /tmp/packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.gpg
        - echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" | sudo tee /etc/apt/sources.list.d/vscode.list >/dev/null
        - rm -f /tmp/packages.microsoft.gpg
        - sudo apt-get update
        - sudo apt-get install -y code
      windows:
        - choco install vscode -y

  jetbrains-mono:
    description: JetBrains Mono Nerd Font
    tags: [workstation]
    check:
      linux: fc-list
      windows: null
    install:
      linux:
        - mkdir -p "$HOME/.local/share/fonts/JetBrainsMono"
        - curl -fLo /tmp/JetBrainsMono.zip https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
        - unzip -o /tmp/JetBrainsMono.zip -d "$HOME/.local/share/fonts/JetBrainsMono"
        - rm -f /tmp/JetBrainsMono.zip
        - fc-cache -fv
      windows:
        - choco install nerd-fonts-jetbrainsmono -y

configs:
  git:
    description: Git configuration
    source: git/.gitconfig
    targets:
      linux: ~/.gitconfig
      windows: ~/.gitconfig

  fish:
    description: Fish shell configuration
    source: fish/config.fish
    targets:
      linux: ~/.config/fish/config.fish

  nvim:
    description: Neovim configuration directory
    source: nvim
    targets:
      linux: ~/.config/nvim
      windows: ~/AppData/Local/nvim

  wezterm:
    description: WezTerm configuration
    source: wezterm/wezterm.lua
    targets:
      linux: ~/.config/wezterm/wezterm.lua
      windows: ~/.wezterm.lua

  starship:
    description: Starship prompt configuration
    source: starship/starship.toml
    targets:
      linux: ~/.config/starship.toml
      windows: ~/.config/starship.toml

  yazi-config:
    description: Yazi main configuration
    source: yazi/yazi.toml
    targets:
      linux: ~/.config/yazi/yazi.toml
      windows: ~/AppData/Roaming/yazi/config/yazi.toml

  yazi-theme:
    description: Yazi theme
    source: yazi/theme.toml
    targets:
      linux: ~/.config/yazi/theme.toml
      windows: ~/AppData/Roaming/yazi/config/theme.toml

  yazi-keymap:
    description: Yazi key mappings
    source: yazi/keymap.toml
    targets:
      linux: ~/.config/yazi/keymap.toml
      windows: ~/AppData/Roaming/yazi/config/keymap.toml

tags:
  core: Core command-line utilities
  shell: Shell and prompt configuration
  terminal: Terminal applications
  editor: Neovim and parser tooling
  dev: Development environment
  workstation: Complete workstation setup
